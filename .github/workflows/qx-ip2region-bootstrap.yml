name: Bootstrap ip2region Worker database
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/qx-ip2region-bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: qx-ip2region-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check upstream access
        run: |
          curl --fail --show-error --silent https://qx-ip2region.haonan-h6709.workers.dev/diagnostics
      - name: Start initial XDB synchronization
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 3 \
            https://qx-ip2region.haonan-h6709.workers.dev/bootstrap
      - name: Wait for verified IPv4 and IPv6 release
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if curl --fail --show-error --silent \
              https://qx-ip2region.haonan-h6709.workers.dev/health \
              | jq -e '.initialized == true and .versions.v4 != null and .versions.v6 != null'; then
              exit 0
            fi
            sleep 20
          done
          echo "Initial database update incomplete. Inspect Worker logs and R2." >&2
          exit 1
